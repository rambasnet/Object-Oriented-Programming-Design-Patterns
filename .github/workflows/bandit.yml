name: Python security checks

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    bandit:
        name: Bandit security scan
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14"

            - name: Install Bandit
              run: python -m pip install bandit

            - name: Scan Python solutions H0
              run: bandit -r demo-assignments/A0/hello/src

            - name: Scan Python solutions H0-OOP
              run: bandit -r demo-assignments/A0-OOP/hello/src

            - name: Scan Python solutions H1
              run: bandit -r demo-assignments/A1/cold/src

            - name: Scan Python solutions H1-OOP
              run: bandit -r demo-assignments/A1-OOP/cold/src

            - name: Scan Python solutions H2-ABC
              run: bandit -r demo-assignments/A2-ABC/egypt/src
